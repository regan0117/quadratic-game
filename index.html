 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>이차방정식 게임</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;
padding:20px;
}

.card{
background:#1e293b;
width:95%;
max-width:1100px;
margin:auto;
padding:40px;
border-radius:30px;
margin-top:20px;
}

h1{font-size:55px;}

#problem{
font-size:50px;
margin:35px;
line-height:1.8;
}

#mode{font-size:35px;}

#timer{
font-size:60px;
color:yellow;
margin:20px;
}

input{
width:90px;
height:70px;
font-size:35px;
text-align:center;
border:none;
border-radius:15px;
margin:8px;
}

button{
padding:20px 45px;
font-size:32px;
border:none;
border-radius:20px;
cursor:pointer;
margin-top:25px;
}

#result{
font-size:60px;
margin-top:25px;
height:80px;
}
</style>
</head>

<body>

<h1>🎮 이차방정식 게임</h1>

<div class="card">

<div>점수: <span id="score">0</span></div>
<div>목숨: <span id="life">3</span></div>

<div id="timer">20</div>

<h2 id="mode"></h2>
<div id="problem"></div>

<button onclick="submitAnswer()">제출</button>

<div id="result"></div>

</div>

<script>

let score=0;
let life=3;
let answer=[];
let timer;
let startTime;

/* ================= 공통 ================= */

function updateUI(){
document.getElementById("score").innerText=score;
document.getElementById("life").innerText=life;
}

function startTimer(){
clearInterval(timer);
let t=20;

timer=setInterval(()=>{
t--;
document.getElementById("timer").innerText=t;

if(t<=0){
clearInterval(timer);
life--;
if(life<=0) return gameOver();
newProblem();
}

},1000);
}

/* ================= 정수해 (원본 유지 구조) ================= */

function integerMode(){

document.getElementById("mode").innerText="정수해";

let r1=Math.floor(Math.random()*10)+1;
let r2=Math.floor(Math.random()*10)+1;

let b=-(r1+r2);
let c=r1*r2;

answer=[r1,r2];

setProblem(`
x² ${b>=0?"+":""}${b}x ${c>=0?"+":""}${c}=0
<br><br>
x = <input id="a">
`);
}

/* ================= 유리수해 (새로 분리, 침범 없음) ================= */

function rationalMode(){

document.getElementById("mode").innerText="유리수해";

let n1=Math.floor(Math.random()*10)+1;
let d1=Math.floor(Math.random()*5)+1;

let n2=Math.floor(Math.random()*10)+1;
let d2=Math.floor(Math.random()*5)+1;

/* 해 저장 */
answer=[[n1,d1],[n2,d2]];

/* 계수 계산 (정수 유지) */
let v1=n1/d1;
let v2=n2/d2;

let lcm=d1*d2;

let b=-(v1+v2)*lcm;
let c=(v1*v2)*lcm;

b=Math.round(b);
c=Math.round(c);

setProblem(`
x² ${b>=0?"+":""}${b}x ${c>=0?"+":""}${c}=0
<br><br>

x =
<div>
<input id="n1"> / <input id="d1">
,
<input id="n2"> / <input id="d2">
</div>
`);
}

/* ================= 근의 공식 (절대 유지) ================= */

function rootMode(){

document.getElementById("mode").innerText="근의 공식";

let a,b,c,D;
let range=5;

while(true){
a=Math.floor(Math.random()*range)+1;
b=Math.floor(Math.random()*20)-10;
c=Math.floor(Math.random()*range)+1;

D=b*b-4*a*c;

if(D>0 && Math.sqrt(D)%1!==0) break;
}

setProblem(`
${a}x² ${b>=0?"+":""}${b}x ${c>=0?"+":""}${c}=0
<br><br>

x =
<input>
± √<input>
———
<input>
`);

answer=["root"];
}

/* ================= 공통 출력 함수 (핵심 안정장치) ================= */

function setProblem(html){
document.getElementById("problem").innerHTML=html;
}

/* ================= 문제 생성 ================= */

function newProblem(){

document.getElementById("result").innerText="";

let r=Math.random();

if(r<0.33) integerMode();
else if(r<0.66) rationalMode();
else rootMode();

startTime=Date.now();
startTimer();
}

/* ================= 채점 ================= */

function submitAnswer(){

clearInterval(timer);

if(document.getElementById("mode").innerText.includes("정수")){

let a=Number(document.getElementById("a").value);

if(a==answer[0] || a==answer[1]){
score+=10;
document.getElementById("result").innerText="⭕ 정답";
}else{
life--;
document.getElementById("result").innerText="❌ 오답";
}

}else if(document.getElementById("mode").innerText.includes("유리수")){

let n1=Number(document.getElementById("n1").value);
let d1=Number(document.getElementById("d1").value);
let n2=Number(document.getElementById("n2").value);
let d2=Number(document.getElementById("d2").value);

let r1=answer[0];
let r2=answer[1];

if(
n1==r1[0] && d1==r1[1] &&
n2==r2[0] && d2==r2[1]
){
score+=10;
document.getElementById("result").innerText="⭕ 정답";
}else{
life--;
document.getElementById("result").innerText="❌ 오답";
}

}

updateUI();

if(life<=0) return gameOver();
setTimeout(newProblem,1000);
}

/* ================= 종료 ================= */

function gameOver(){
alert("게임 종료! 점수: "+score);
score=0;
life=3;
updateUI();
newProblem();
}

newProblem();

</script>

</body>
</html>
