 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>이차방정식 게임 + 랭킹</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;
padding:20px;
}

.card{
background:#1e293b;
width:95%;
max-width:1100px;
margin:auto;
padding:40px;
border-radius:30px;
margin-top:20px;
}

h1{font-size:50px;}

#problem{
font-size:45px;
margin:30px;
}

input{
font-size:30px;
width:120px;
text-align:center;
}

button{
font-size:25px;
padding:10px 20px;
margin-top:20px;
cursor:pointer;
}

#ranking{
margin-top:30px;
font-size:25px;
}
</style>

</head>

<body>

<h1>🎮 이차방정식 게임</h1>

<div class="card">

<div>점수: <span id="score">0</span></div>
<div>목숨: <span id="life">3</span></div>

<div id="problem"></div>

<button onclick="submitAnswer()">제출</button>

<div id="result"></div>

<div id="ranking"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 Firebase 설정 (여기만 네 걸로 바꿔) */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===== 게임 변수 ===== */
let score = 0;
let life = 3;
let answer = [];
let playerName = prompt("닉네임 입력");

/* ===== 문제 생성 ===== */
function newProblem(){

let r1 = Math.floor(Math.random()*10)+1;
let r2 = Math.floor(Math.random()*10)+1;

let b = -(r1 + r2);
let c = r1 * r2;

answer = [r1, r2];

document.getElementById("problem").innerHTML =
`x² ${b>=0?"+":""}${b}x ${c>=0?"+":""}${c}=0
<br><br>
x = <input id="a">`;

}

/* ===== UI ===== */
function updateUI(){
document.getElementById("score").innerText = score;
document.getElementById("life").innerText = life;
}

/* ===== 채점 ===== */
function submitAnswer(){

let a = Number(document.getElementById("a").value);

if(a == answer[0] || a == answer[1]){
score += 10;
document.getElementById("result").innerText = "⭕ 정답";
}else{
life--;
document.getElementById("result").innerText = "❌ 오답";
}

updateUI();

if(life <= 0){
gameOver();
}else{
newProblem();
}

}

/* ===== Firebase 저장 ===== */
async function saveScore(){
await addDoc(collection(db,"ranking"),{
name: playerName,
score: score,
time: Date.now()
});
}

/* ===== 랭킹 불러오기 ===== */
async function loadRanking(){

const q = query(collection(db,"ranking"), orderBy("score","desc"));
const snap = await getDocs(q);

let html = "<h2>🏆 TOP 5</h2>";
let i = 0;

snap.forEach(doc=>{
if(i < 5){
let d = doc.data();
html += `${i+1}위 ${d.name} - ${d.score}<br>`;
i++;
}
});

document.getElementById("ranking").innerHTML = html;
}

/* ===== 게임 종료 ===== */
async function gameOver(){

await saveScore();
await loadRanking();

alert("게임 종료! 점수: " + score);

score = 0;
life = 3;
updateUI();
newProblem();

}

/* 시작 */
newProblem();
updateUI();

</script>

</body>
</html>
