 <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>이차방정식 게임</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;
padding:20px;
}

.card{
background:#1e293b;
width:95%;
max-width:1100px;
margin:auto;
padding:40px;
border-radius:30px;
margin-top:20px;
}

h1{font-size:55px;}

#problem{
font-size:50px;
margin:35px;
line-height:1.8;
}

#timer{
font-size:60px;
color:yellow;
margin:20px;
}

.info{font-size:35px;}

input{
width:90px;
height:70px;
font-size:35px;
text-align:center;
border:none;
border-radius:15px;
margin:8px;
}

button{
padding:20px 45px;
font-size:32px;
border:none;
border-radius:20px;
cursor:pointer;
margin-top:25px;
}

#result{
font-size:60px;
font-weight:bold;
margin-top:25px;
height:80px;
}
</style>
</head>

<body>

<h1>🎮 이차방정식 게임</h1>

<div class="card">

<div class="info">점수 : <span id="score">0</span></div>
<div class="info">목숨 : <span id="life">3</span></div>

<div id="timer">20</div>

<h2 id="mode"></h2>
<div id="problem"></div>

<button onclick="submitAnswer()">제출</button>

<div id="result"></div>

</div>

<script>

let score=0;
let life=3;
let answer=[];

let timer;
let startTime;

/* ================= 유틸 ================= */

function getRange(){
return Math.min(30, Math.floor(5 + score/8));
}

function updateUI(){
document.getElementById("score").innerText=score;
document.getElementById("life").innerText=life;
}

/* ================= 타이머 ================= */

function startTimer(){
clearInterval(timer);
let remain=20;

timer=setInterval(()=>{
remain--;
document.getElementById("timer").innerText=remain;

if(remain<=0){
clearInterval(timer);
life--;
updateUI();
if(life<=0) return gameOver();
setTimeout(newProblem,1000);
}

},1000);
}

/* ================= 유리수해 (핵심 수정) ================= */

function randomFraction(range){
let n=Math.floor(Math.random()*range*2)-range;
let d=Math.floor(Math.random()*range)+1;
return [n,d];
}

function randomInteger(range){
return [Math.floor(Math.random()*range)+1,1];
}

function mixedRoot(range){
return Math.random()<0.5
? randomInteger(range)
: randomFraction(range);
}

/* ✔ 분수 UI 렌더 */
function renderFraction(id,val){

if(val[1] === 1){
return `<input id="${id}">`;
}

return `
<div style="display:inline-flex;flex-direction:column;align-items:center;">
  <input id="${id}n">
  <div style="width:60px;border-top:2px solid white;"></div>
  <input id="${id}d">
</div>
`;
}

/* ================= 유리수해 문제 ================= */

function fractionMode(){

let range=getRange();

let r1=mixedRoot(range);
let r2=mixedRoot(range);

answer=[r1,r2];

document.getElementById("problem").innerHTML=`
x² = ...
<br><br>

x =
${renderFraction("x1",r1)}
,
${renderFraction("x2",r2)}
`;

}

/* ================= 근의 공식 ================= */

function simplifyRoot(n){
let out=1, inside=n;
for(let i=2;i*i<=inside;i++){
while(inside%(i*i)==0){
out*=i;
inside/=i*i;
}
}
return [out,inside];
}

function rootMode(){

let range=getRange();

let a,b,c,D;

while(true){
a=Math.floor(Math.random()*range)+1;
b=Math.floor(Math.random()*range*4)-(range*2);
c=Math.floor(Math.random()*range)+1;

D=b*b-4*a*c;
if(D>0 && Math.sqrt(D)%1!==0) break;
}

let d,e,f;

if(b%2==0){
d=a;
e=-b/2;
f=D/4;
}else{
d=2*a;
e=-b;
f=D;
}

let temp=simplifyRoot(f);
answer=[d,e,temp[0],temp[1]];

if(d==1){

document.getElementById("problem").innerHTML=`
x =
<input id="eBox">
± √<input id="inBox">
`;

}else{

document.getElementById("problem").innerHTML=`
x =
<input id="eBox">
± √<input id="inBox">
<br>
———
<input id="dBox">
`;
}
}

/* ================= 문제 생성 ================= */

function newProblem(){
if(Math.random()<0.5) fractionMode();
else rootMode();

startTime=Date.now();
startTimer();
}

/* ================= 채점 ================= */

function readFraction(id){
let n=document.getElementById(id+"n");
let d=document.getElementById(id+"d");

if(!d) return Number(document.getElementById(id).value);

return Number(n.value)/Number(d.value);
}

function submitAnswer(){

clearInterval(timer);

let gain=Math.max(1,20-Math.floor((Date.now()-startTime)/1000));

if(document.getElementById("x1n")){

let x1=readFraction("x1");
let x2=readFraction("x2");

let r1=answer[0][0]/answer[0][1];
let r2=answer[1][0]/answer[1][1];

if((x1==r1 && x2==r2)||(x1==r2 && x2==r1)){
score+=gain;
}else{
life--;
}

}else{

let e=Number(document.getElementById("eBox").value);
let inb=Number(document.getElementById("inBox").value);

let d=document.getElementById("dBox")
? Number(document.getElementById("dBox").value)
:1;

if(d==answer[0] && e==answer[1] && inb==answer[3]){
score+=gain;
}else{
life--;
}

}

updateUI();

if(life<=0) return gameOver();
setTimeout(newProblem,1000);
}

/* ================= 게임오버 ================= */

function gameOver(){
alert("게임 종료! 점수: "+score);
score=0;
life=3;
updateUI();
newProblem();
}

newProblem();

</script>

</body>
</html>
