<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Quadratic Game</title>
<style>
body {
    font-family: Arial;
    text-align: center;
    background: #0f172a;
    color: white;
}

.card {
    background: #1e293b;
    padding: 20px;
    margin: 20px auto;
    width: 90%;
    max-width: 500px;
    border-radius: 15px;
}

button {
    padding: 10px 20px;
    margin: 5px;
    font-size: 16px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}

input {
    padding: 10px;
    font-size: 16px;
    width: 60px;
    text-align: center;
}

.start {
    background: #22c55e;
}

.next {
    background: #3b82f6;
}

</style>
</head>

<body>

<h1>🎮 Quadratic Game</h1>

<div class="card">
    <h2 id="problem">Press Start</h2>

    <div id="gameArea" style="display:none;">
        <p>Enter roots:</p>
        <input id="x1">
        <input id="x2">
        <br><br>
        <button onclick="check()">Submit</button>
    </div>

    <button class="start" onclick="startGame()">Start</button>
    <button class="next" onclick="nextProblem()">Next</button>

    <h3 id="status"></h3>
    <p>Score: <span id="score">0</span></p>
    <p>Life: <span id="life">3</span></p>
</div>

<script>
let r1, r2;
let score = 0;
let life = 3;
let startTime;

function generate() {
    r1 = Math.floor(Math.random()*9)+1;
    r2 = Math.floor(Math.random()*9)+1;

    let b = -(r1 + r2);
    let c = r1 * r2;

    document.getElementById("problem").innerText =
        `x² ${b>=0?"+":""}${b}x + ${c} = 0`;

    startTime = new Date().getTime();
}

function startGame() {
    score = 0;
    life = 3;
    update();
    document.getElementById("gameArea").style.display = "block";
    generate();
}

function check() {
    let x1 = parseInt(document.getElementById("x1").value);
    let x2 = parseInt(document.getElementById("x2").value);

    let t = (new Date().getTime() - startTime)/1000;
    let gain = Math.max(1, Math.floor(20 - t));

    if((x1==r1 && x2==r2) || (x1==r2 && x2==r1)) {
        score += gain;
        document.getElementById("status").innerText = "✔ Correct +" + gain;
    } else {
        life--;
        document.getElementById("status").innerText = "✖ Wrong";
    }

    update();

    if(life <= 0) {
        saveRank();
        alert("Game Over! Score: " + score);
    } else {
        generate();
    }
}

function update() {
    document.getElementById("score").innerText = score;
    document.getElementById("life").innerText = life;
}

function saveRank() {
    let name = prompt("Nickname?");
    let data = JSON.parse(localStorage.getItem("rank") || "[]");

    data.push({name:name, score:score});
    data.sort((a,b)=>b.score-a.score);
    data = data.slice(0,5);

    localStorage.setItem("rank", JSON.stringify(data));
}

function nextProblem() {
    generate();
}
</script>

</body>
</html>
