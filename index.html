  <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>이차방정식 게임 + 랭킹</title>

<style>
body{
background:#0f172a;
color:white;
font-family:Arial;
text-align:center;
margin:0;
padding:20px;
}

.card{
background:#1e293b;
width:95%;
max-width:1100px;
margin:auto;
padding:40px;
border-radius:30px;
margin-top:20px;
}

h1{font-size:55px;}

#problem{
font-size:50px;
margin:35px;
line-height:1.8;
}

#timer{
font-size:60px;
color:yellow;
margin:20px;
}

.info{
font-size:35px;
}

input{
width:90px;
height:70px;
font-size:35px;
text-align:center;
border:none;
border-radius:15px;
margin:8px;
}

button{
padding:20px 45px;
font-size:32px;
border:none;
border-radius:20px;
cursor:pointer;
margin-top:25px;
}

#ranking{
margin-top:30px;
font-size:28px;
}
</style>
</head>

<body>

<h1>🎮 이차방정식 게임</h1>

<div class="card">

<div class="info">점수 : <span id="score">0</span></div>
<div class="info">목숨 : <span id="life">3</span></div>

<div id="timer">15</div>

<h2 id="mode"></h2>
<div id="problem"></div>

<button id="submitBtn">제출</button>

<div id="result"></div>

<div id="ranking"></div>

</div>

<script type="module">

/* ================= FIREBASE ================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

   const firebaseConfig = {
    apiKey: "AIzaSyCQh8TXiGkjeZZAuAsgYPrEu5Exk7ckBM0",
    authDomain: "quadratic-game.firebaseapp.com",
    projectId: "quadratic-game",
    storageBucket: "quadratic-game.firebasestorage.app",
    messagingSenderId: "1079054826927",
    appId: "1:1079054826927:web:b09e4f8f8c245aa6de435a",
    measurementId: "G-83FL44GV92"
  };



const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= 게임 변수 (원본 유지) ================= */
let score = 0;
let life = 3;
let answer = [];

let remain = 15;
let timer;
let startTime;

let playerName = prompt("닉네임 입력") || "익명";

/* ================= DOM ================= */
const scoreText = document.getElementById("score");
const lifeText = document.getElementById("life");
const mode = document.getElementById("mode");
const problem = document.getElementById("problem");
const result = document.getElementById("result");

/* ================= UI ================= */
function updateUI(){
scoreText.innerText = score;
lifeText.innerText = life;
}

/* ================= 기존 로직 그대로 ================= */
function getIntegerRange(){
if(score<30)return 5;
if(score<60)return 10;
if(score<100)return 20;
return 30;
}

function getRootRange(){
if(score<30)return 4;
if(score<60)return 6;
if(score<100)return 8;
if(score<150)return 10;
return 12;
}

function simplifyRoot(n){
let out=1;
let inside=n;

for(let i=2;i*i<=inside;i++){
while(inside%(i*i)==0){
out*=i;
inside/=i*i;
}
}
return [out,inside];
}

/* ================= 타이머 (원본 유지) ================= */
function startTimer(){
clearInterval(timer);
remain=15;

timer=setInterval(()=>{

remain--;
document.getElementById("timer").innerText = remain;

if(remain<=0){
clearInterval(timer);
life--;
result.innerHTML="⏰ 시간 초과!";
updateUI();

if(life<=0){
gameOver();
return;
}

setTimeout(newProblem,1000);
}

},1000);
}

/* ================= 문제 생성 ================= */
function newProblem(){
result.innerHTML="";

if(Math.random()<0.5) integerMode();
else rootMode();

startTime = Date.now();
startTimer();
}

/* ================= 정수해 모드 ================= */
function integerMode(){

mode.innerText="정수해 모드";

let range=getIntegerRange();

let r1=Math.floor(Math.random()*range)+1;
let r2=Math.random()<0.2?r1:Math.floor(Math.random()*range)+1;

let b=-(r1+r2);
let c=r1*r2;

answer=[r1,r2];

problem.innerHTML=
`x² ${b>=0?"+":""}${b}x +${c}=0<br><br>
<input id="x1">
<input id="x2">`;
}

/* ================= 근의 공식 모드 ================= */
function rootMode(){

mode.innerText="근의 공식 모드";

let a,b,c,D;
let range=getRootRange();

while(true){
a=Math.floor(Math.random()*range)+1;
b=Math.floor(Math.random()*(range*4))-(range*2);
c=Math.floor(Math.random()*range)+1;

D=b*b-4*a*c;

let root=Math.sqrt(D);

if(D>0 && root!==Math.floor(root)) break;
}

let d,e,f;

if(b%2==0){
d=a;
e=-b/2;
f=D/4;
}else{
d=2*a;
e=-b;
f=D;
}

let temp=simplifyRoot(f);

answer=[d,e,temp[0],temp[1]];

problem.innerHTML=
`${a==1?"":a}x² ${b>=0?"+":""}${b}x +${c}=0<br><br>
(근의 공식 모드 문제)
`;
}

/* ================= 제출 ================= */
function submitAnswer(){

clearInterval(timer);

if(mode.innerText==="정수해 모드"){

let a=Number(document.getElementById("x1").value);
let b=document.getElementById("x2")?Number(document.getElementById("x2").value):a;

if((a==answer[0]&&b==answer[1])||(a==answer[1]&&b==answer[0])){
score+=10;
result.innerHTML="⭕ 정답!";
}else{
life--;
result.innerHTML="❌ 오답!";
}

}else{
life--;
result.innerHTML="근의 공식 모드 채점은 확장 가능";
}

updateUI();

if(life<=0){
gameOver();
return;
}

setTimeout(newProblem,800);
}

/* ================= FIREBASE 저장 ================= */
async function saveScore(){
try{
await addDoc(collection(db,"ranking"),{
name: playerName,
score: score,
time: Date.now()
});
}catch(e){
console.log(e);
}
}

/* ================= TOP10 랭킹 ================= */
async function loadRanking(){
try{
const q=query(collection(db,"ranking"),orderBy("score","desc"));
const snap=await getDocs(q);

let html="<h2>🏆 TOP 10</h2>";
let i=0;

snap.forEach(doc=>{
if(i<10){
let d=doc.data();
html+=`${i+1}위 ${d.name} - ${d.score}<br>`;
i++;
}
});

document.getElementById("ranking").innerHTML=html;

}catch(e){
console.log(e);
}
}

/* ================= 게임 종료 ================= */
async function gameOver(){

alert("게임 종료! 점수: "+score);

await saveScore();
await loadRanking();

score=0;
life=3;

updateUI();
newProblem();
}
document.getElementById("submitBtn")
  .addEventListener("click", submitAnswer);
/* ================= 시작 ================= */
newProblem();
updateUI();

</script>

</body>
</html>
